[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router-monitor"
version = "0.0.2"
description = "Multi-Router monitoring dashboard with automatic detection and SGLang worker maintenance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.23,<1",
    "typer>=0.15,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.12",
    "rich>=13,<16",
]

[project.optional-dependencies]
dev = ["build>=1,<2", "ruff>=0.17,<1"]

[project.urls]
Repository = "https://github.com/wenxueru/llm-router-monitor"
Issues = "https://github.com/wenxueru/llm-router-monitor/issues"

[project.scripts]
llm-router-monitor = "router_monitor.cli:main"
rmon = "router_monitor.cli:main"
router-monitor = "router_monitor.cli:main"
sglang-router-monitor = "router_monitor.cli:main"

[tool.setuptools]
packages = ["router_monitor"]
include-package-data = false

[tool.setuptools.package-data]
router_monitor = ["templates/*.html"]

[tool.ruff]
target-version = "py310"
line-length = 128

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true
select = ["E4", "E7", "E9", "F", "I", "EXE", "PLW1508", "S110", "S112", "BLE001", "C408"]
