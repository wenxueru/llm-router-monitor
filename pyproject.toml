[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-router-monitor"
version = "0.1.0"
description = "Multi-Router monitoring dashboard with automatic detection and SGLang worker maintenance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.23,<1",
    "typer>=0.15,<1",
    "httpx>=0.27,<1",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.17,<1"]

[project.scripts]
sglang-router-monitor = "router_monitor.cli:main"

[tool.setuptools]
packages = ["router_monitor"]

[tool.setuptools.package-data]
router_monitor = ["templates/*.html"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "EXE", "PLW1508", "S110", "S112", "BLE001", "C408"]
